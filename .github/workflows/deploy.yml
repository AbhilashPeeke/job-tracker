name: Deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React
        working-directory: job-tracker-ui
        run: |
          npm ci
          npm run build

      - name: Copy React build into the API
        run: |
          mkdir -p JobApplicationApi/wwwroot
          cp -r job-tracker-ui/dist/. JobApplicationApi/wwwroot/

      - name: Publish API
        run: dotnet publish JobApplicationApi/JobApplicationApi.csproj -c Release -o ${{ github.workspace }}/publish

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      - uses: azure/webapps-deploy@v3
        with:
          app-name: 'jobtracker-abhilash'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app
